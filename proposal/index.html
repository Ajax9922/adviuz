<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Proposal — Adviuz</title>
<link rel="icon" type="image/png" href="/brand/favicon-32.png">
<style>
  :root{ --text:#111318; --sub:#6b7280; --line:#e5e7eb; --green:#15803d; --brand:#230835; --accent:#4000f3; --pink:#e65afc; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:Helvetica,Arial,sans-serif; }
  body{ background:#f0f2f5; padding:24px 12px 60px; display:flex; justify-content:center; }
  .page{ width:100%; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(16,10,40,.08); }
  .hair{ height:5px; background:linear-gradient(90deg,var(--accent),var(--pink)); }
  .head{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 22px; border-bottom:1px solid #eeeeee; }
  .head img{ height:16px; display:block; }
  .est2014{ font-size:10px; color:#9a9a9a; letter-spacing:.3px; white-space:nowrap; }
  .hlabel{ font-size:11px; font-weight:700; letter-spacing:.16em; color:#9a9a9a; text-transform:uppercase; text-align:right; min-width:0; line-height:1.5; }
  .body{ padding:24px 26px 28px; }
  .to p{ font-size:13px; color:#222; margin:0 0 4px; }
  .to .co{ font-size:14px; font-weight:700; color:#111827; margin:0 0 10px; }
  .subject{ font-size:15px; font-weight:700; color:#111827; margin:16px 0 14px; }
  p.t{ font-size:13px; color:#4b5563; line-height:1.7; margin:0 0 12px; }
  .custom{ background:#faf8ff; border-left:3px solid var(--accent); padding:10px 14px; font-size:13px; color:#3b3355; line-height:1.7; margin:0 0 14px; }
  h3.sec{ margin:24px 0 10px; font-size:15px; font-weight:700; color:#111827; border-bottom:1px solid #e5e7eb; padding-bottom:6px; }
  ul.plain{ margin:0 0 4px; padding-left:20px; font-size:13px; color:#374151; line-height:1.9; }
  .mng{ border:1px solid #e6dcf7; background:#faf8ff; border-radius:12px; padding:14px 16px; }
  .mngt{ font-size:13.5px; font-weight:700; color:#111827; margin-bottom:9px; }
  .mrow{ display:flex; gap:9px; align-items:baseline; font-size:12.5px; color:#4b5563; padding:4px 0; line-height:1.5; }
  .mx{ color:#b91c1c; font-weight:800; font-size:11px; flex-shrink:0; }
  .mclose{ border-top:1px solid #ece5f9; margin-top:10px; padding-top:10px; font-size:12.5px; font-weight:700; color:#111827; line-height:1.55; }
  .pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pcat{ border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:#fff; }
  .pcat.wide{ grid-column:1 / -1; }
  .pcat .ph{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .pcat .pic{ width:26px; height:26px; border-radius:8px; background:#f3efff; color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pcat .pt{ font-size:12px; font-weight:700; color:#111827; letter-spacing:.02em; }
  .pcat .pi{ font-size:11.5px; color:#4b5563; line-height:1.5; padding:3px 0; display:flex; gap:6px; align-items:baseline; }
  .pcat .pi:before{ content:''; width:5px; height:5px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--pink)); flex-shrink:0; position:relative; top:-1px; }
  .flow{ position:relative; padding-left:6px; }
  .fstep{ display:flex; gap:13px; position:relative; padding-bottom:18px; }
  .fstep:last-child{ padding-bottom:2px; }
  .fstep:not(:last-child):before{ content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:#ece5f9; }
  .fnum{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--pink)); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; }
  .ft2{ padding-top:4px; }
  .ft2 .a{ font-size:13.5px; font-weight:700; color:#111827; }
  .ft2 .b{ font-size:12px; color:#6b7280; line-height:1.6; margin-top:2px; }
  .pk{ border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:16px; }
  .pk.rec{ border:1.5px solid var(--accent); }
  .pkh{ height:4px; background:linear-gradient(90deg,var(--accent),var(--pink)); }
  .pkb{ padding:20px 22px 22px; }
  .pktop{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .pkn{ font-size:15px; font-weight:700; color:#111827; padding-top:2px; }
  .badge{ display:inline-block; vertical-align:2px; background:var(--brand); color:#fff; font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:99px; margin-left:5px; white-space:nowrap; }
  .pkp{ text-align:right; }
  .pkp .amt{ font-size:19px; font-weight:750; color:#111827; }
  .pkp .tax{ font-size:10px; color:#9ca3af; }
  .pkdesc{ font-size:12px; color:#6b7280; margin-top:6px; line-height:1.6; }
  .plabel{ font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--green); margin:16px 0 10px; border-top:1px solid #eef0f3; padding-top:15px; }
  .prow{ display:flex; gap:10px; align-items:baseline; font-size:13px; color:#374151; margin-bottom:9px; line-height:1.55; }
  .prow b{ font-weight:700; color:#111827; }
  .tick{ color:var(--green); font-weight:700; font-size:11px; }
  .validity{ font-size:10.5px; color:#9ca3af; margin-top:12px; }
  .pkbtn{ display:block; text-align:center; background:var(--brand); color:#fff; font-size:13px; font-weight:700; padding:13px; border-radius:10px; margin-top:16px; text-decoration:none; }
  .pk.rec .pkbtn{ background:var(--accent); }
  .budget{ font-size:12px; color:#6b7280; text-align:center; line-height:1.6; margin:2px 0 0; }
  .lmgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lmcard{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:12px 13px; text-decoration:none; background:#fff; }
  .lmic{ width:30px; height:30px; border-radius:50%; background:#f3efff; color:#4000f3; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .lmt{ display:block; font-size:12.5px; font-weight:700; color:#111827; }
  .lms{ display:block; font-size:10.5px; color:#6b7280; margin-top:1px; }
  .hsgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hscard{ border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:#fff; }
  .hsnum{ display:inline-flex; width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#4000f3,#e65afc); color:#fff; font-size:12px; font-weight:800; align-items:center; justify-content:center; margin-bottom:7px; }
  .hst{ font-size:12.5px; font-weight:700; color:#111827; }
  .hsd{ font-size:11px; color:#6b7280; margin-top:2px; line-height:1.5; }
  .final{ border:1px solid #e6dcf7; border-radius:16px; background:#fff; padding:22px 18px; text-align:center; position:relative; overflow:hidden; margin-top:20px; }
  .fg1{ position:absolute; right:-50px; top:-50px; width:170px; height:170px; border-radius:50%; background:radial-gradient(circle,rgba(230,90,252,.10),transparent 70%); }
  .fg2{ position:absolute; left:-50px; bottom:-60px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,rgba(64,0,243,.08),transparent 70%); }
  .fhead{ font-size:16.5px; font-weight:700; color:#111318; letter-spacing:-.01em; position:relative; }
  .fsub{ font-size:12px; color:#6b7280; margin:5px 0 16px; line-height:1.55; position:relative; }
  .fbtns{ display:grid; grid-template-columns:1fr 1fr; gap:9px; position:relative; }
  .fcall{ display:block; text-align:center; background:linear-gradient(90deg,#4000f3,#e65afc); color:#fff; font-size:13px; font-weight:700; padding:13px 4px; border-radius:10px; text-decoration:none; }
  .fwa{ display:block; text-align:center; background:#25D366; color:#fff; font-size:13px; font-weight:700; padding:13px 4px; border-radius:10px; text-decoration:none; }
  .fpdf{ display:block; text-align:center; background:#fff; border:1.5px solid #e6dcf7; color:#4000f3; font-size:12.5px; font-weight:700; padding:11px; border-radius:10px; text-decoration:none; margin-top:9px; position:relative; cursor:pointer; }
  .fsig{ font-size:11px; color:#6b7280; margin-top:14px; position:relative; }
  .fsig b{ color:#111318; }
  h4.tc{ margin:26px 0 8px; font-size:13px; font-weight:700; color:#111827; border-bottom:1px solid #e5e7eb; padding-bottom:6px; }
  ul.tcl{ margin:0; padding-left:18px; font-size:10.5px; color:#9ca3af; line-height:1.8; }
  ul.tcl a{ color:#9ca3af; }
  .foot{ background:#fafafa; border-top:1px solid #eeeeee; padding:20px 16px; text-align:center; }
  .ftn{ font-size:13px; font-weight:700; color:#111; margin-bottom:2px; }
  .fh{ font-size:11px; color:#999; margin-bottom:12px; }
  .pill{ display:inline-block; background:#fff; border:1px solid #e2e2e2; border-radius:999px; padding:8px 16px; margin:3px; font-size:12px; text-decoration:none; }
  .pill.web{ color:var(--accent); } .pill.tel{ color:#444; }
  .legal{ border-top:1px solid #e8e8e8; margin-top:12px; padding-top:12px; font-size:10.5px; color:#9a9a9a; line-height:1.6; }
  .loading{ text-align:center; padding:80px 20px; color:#6b7280; font-size:14px; }
  /* PDF mode: page laid out at a fixed 560px width while the PDF is captured */
  body.pdfmode{ display:block; padding:0; background:#fff; overflow-x:hidden; }
  body.pdfmode .page{ width:560px!important; max-width:none; border:none; border-radius:0; box-shadow:none; margin:0; }
  body.pdfmode .fpdf, body.pdfmode .prevbar{ display:none!important; }
  .pdfwait{ position:fixed; inset:0; z-index:200; background:rgba(255,255,255,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-size:14px; color:#111318; font-weight:700; }
  .pdfwait i{ width:34px; height:34px; border-radius:50%; border:3px solid #ece5f9; border-top-color:#4000f3; animation:pdfspin .8s linear infinite; }
  @keyframes pdfspin{ to{ transform:rotate(360deg); } }
  @media print{
    body{ background:#fff; padding:0; }
    .page{ box-shadow:none; border:none; max-width:none; border-radius:0; }
    .fpdf, .fbtns, .prevbar{ display:none!important; }
    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
    .tax, .validity, ul.tcl, ul.tcl a, .fh, .legal, .est2014, .fsub, .fsig, .budget{ color:#4b5563!important; }
    p.t{ color:#374151!important; }
    .pkbtn{ background:#230835!important; color:#fff!important; }
  }
/* pplans-1 */
.offer{display:block;text-decoration:none;color:#fff;border-radius:14px;padding:16px 18px;margin:4px 0 14px;background:linear-gradient(118deg,#4000f3,#8b2bf7 55%,#e65afc)}

.offer .ofd{width:6px;height:6px;border-radius:50%;background:#ff7aa2}

.npt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.npk{font-size:16px;font-weight:700;color:#1c1530}.nps{font-size:12px;color:#6b7280;margin-top:2px}

.lmcard.hl{border-color:#cdbcfb;background:#faf7ff}

.rad{position:relative;width:100%;aspect-ratio:1/1.2;margin:6px 0 0;border-radius:18px;overflow:hidden;
 background:radial-gradient(circle at 50% 50%,#efe7ff 0,#f8f5ff 38%,#fff 70%),#fff;
 background-image:radial-gradient(circle at 50% 50%,rgba(139,43,247,.12) 0,rgba(255,255,255,0) 55%),linear-gradient(rgba(91,28,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(91,28,240,.05) 1px,transparent 1px);background-size:100% 100%,22px 22px,22px 22px;border:1px solid #efeaf8}
.rl{position:absolute;inset:0;width:100%;height:100%}.rl line{stroke:#8b5cf6;stroke-width:1.2;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.7}

 box-shadow:0 0 0 10px rgba(139,43,247,.12),0 0 0 22px rgba(139,43,247,.06),0 14px 40px rgba(64,0,243,.45);animation:rpulse 2.4s ease-in-out infinite}

/* sap-2 (Ajax 2026-11-06): plan cards like adviuz.com/pricing */
.pl-card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid #ece8f2;border-radius:18px;padding:22px 20px 18px;margin:0 0 18px;box-shadow:0 8px 24px rgba(35,8,53,.05)}
.pl-rec{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(118deg,#4000f3,#8b2bf7 55%,#e65afc) border-box;box-shadow:0 18px 44px rgba(64,0,243,.14);margin-top:26px}
.pl-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#fff;background:linear-gradient(118deg,#4000f3,#8b2bf7 55%,#e65afc);border-radius:99px;padding:6px 12px;white-space:nowrap}
.pl-card h4{margin:0;font-size:19px;font-weight:600;color:#1b1030}
.pl-for{margin:5px 0 12px;font-size:13px;line-height:1.45;color:#6b7280}
.pl-price{margin:0;font-size:34px;font-weight:600;letter-spacing:-.02em;color:#1b1030;line-height:1}
.pl-price span{font-size:12px;font-weight:700;color:#6b7280;margin-left:5px;letter-spacing:0}
.pl-once{margin:6px 0 0;font-size:12.5px;color:#6b7280}
.pl-save{margin:6px 0 0;font-size:12px;color:#6b7280}.pl-save s{margin-right:6px}.pl-save b{color:#b0218f;font-weight:600}
.pl-cap{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:#f6f1ff;font-size:13.5px;line-height:1.4;color:#1b1030}
.pl-cap b{color:#4000f3;font-weight:600}
.pl-boost{display:table;margin-top:9px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(118deg,#4000f3,#8b2bf7 55%,#e65afc);border-radius:99px;padding:4px 10px}
.pl-list{list-style:none;margin:14px 0 0;padding:0}
.pl-list li{position:relative;padding:5px 0 5px 25px;font-size:13.5px;color:#374151;line-height:1.4}
.pl-list li::before{content:"\2713";position:absolute;left:0;top:6px;width:17px;height:17px;border-radius:50%;background:#eafaf1;color:#0d8a4f;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pl-list em{font-style:normal;color:#6b7280}
.pl-list .pl-fee::before{content:"+";background:#f1f0f4;color:#6b7280}
.pl-list .pl-free{color:#1b1030;font-weight:500}.pl-list .pl-free em{color:#0d8a4f}
.pl-list .pl-plus{color:#1b1030;font-weight:500}
.pl-list .pl-plus::before{content:"+";background:linear-gradient(118deg,#4000f3,#e65afc);color:#fff;font-size:12px}
.pl-allow{margin:12px 0 0;padding:10px 12px;border:1px solid #ece8f2;border-radius:12px;font-size:12.5px;color:#4b5563;line-height:1.45}
.pl-feat{margin:14px 0 14px;border-top:1px solid #ece8f2}
.pl-feat summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px;font-size:13.5px;font-weight:700;color:#4000f3}
.pl-feat summary::-webkit-details-marker{display:none}
.pf-close{display:none}.pl-feat[open] .pf-open{display:none}.pl-feat[open] .pf-close{display:inline}
.pf-chev{width:24px;height:24px;border-radius:50%;background:#f1ebff;position:relative}
.pf-chev::before{content:"";position:absolute;left:50%;top:42%;width:7px;height:7px;border-right:2px solid #4000f3;border-bottom:2px solid #4000f3;transform:translate(-50%,-50%) rotate(45deg)}
.pl-feat[open] .pf-chev{transform:rotate(180deg)}
.pf-g b{display:block;margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7280}

  var PLATS=[["YouTube", "<polygon points=\"10 8 16 12 10 16 10 8\"/><circle cx=\"12\" cy=\"12\" r=\"10\"/>"], ["Facebook", "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8\"/>"], ["Instagram", "<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/>"], ["Messenger", "<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/>"], ["WhatsApp Status", "<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/>"], ["Threads", "<path d=\"M4 6h16M4 12h16M4 18h10\"/>"], ["Google Display", "<rect x=\"2\" y=\"4\" width=\"20\" height=\"13\" rx=\"2\"/><path d=\"M8 21h8M12 17v4\"/>"], ["Google Discovery", "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m16 8-2 6-6 2 2-6z\"/>"], ["TikTok", "<rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"/><path d=\"M11 18h2\"/>"], ["LinkedIn", "<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>"], ["X (Twitter)", "<path d=\"M4 9h16M4 15h16M10 3 8 21M16 3l-2 18\"/>"], ["News sites", "<path d=\"M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V9\"/><path d=\"M10 7h7M10 11h7M10 15h5\"/>"], ["Mobile apps", "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>"], ["SMS", "<path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/><path d=\"M8 9h8M8 13h5\"/>"], ["Email", "<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/><path d=\"m22 7-10 6L2 7\"/>"]];

  var FEAT_AI=[['Reaches every lead',['Instant text reply to every new lead','AI voice call within 60 seconds','Welcome and follow-up emails in your brand&#39;s voice','AI answers inbound and missed calls','Contact only within allowed hours, in the lead&#39;s time zone']],

  // sap-4: tabs — Flyer pricing · AI Engine pricing · Black Friday
  // sap-12 (Ajax): offer price animation — shows the regular price, strikes it out, then counts down
  // to the offer price. Runs once per card when it scrolls into view (and after a tab switch).
  function ppPriceAnim(){
    var els=[].slice.call(document.querySelectorAll('.pl-pa:not(.pa-done)'));
    var finish=function(e){ e.textContent=$m(e.getAttribute('data-to')); e.classList.remove('pa-cut'); e.classList.add('pa-done'); var c=e.closest('.pl-card'); if(c) c.classList.add('pa-shown'); };

    if(reduce || document.body.classList.contains('pdfmode') || !('IntersectionObserver' in window)){ els.forEach(finish); return; }
    var run=function(e){
      if(e._pa) return; e._pa=1;
      setTimeout(function(){ e.classList.add('pa-cut'); }, 250);
      setTimeout(function(){
        var a=Number(e.getAttribute('data-from')), b=Number(e.getAttribute('data-to')), t0=null, D=900;

          e.textContent=$m(Math.round(a+(b-a)*q)); if(k<1) requestAnimationFrame(step); else finish(e); })(performance.now());

  // sap-8 (Ajax): Black Friday bundles read like the flyer cards, with the AI extras in their own

  function bfShape(x){

    var v=g(/([\d,]+) viewed flyers/), m=g(/([\d,]+) AI call minutes/), sm=g(/([\d,]+) texts/), em=g(/([\d,]+) emails/), cm=g(/([\d,]+) call minutes/), e=g(/edits for (\d+) months?/), val=g(/Valid (\d+) months/)||'12';

      +'<div class="hscard"><span class="hsnum">4</span><div class="hst">Go Live</div><div class="hsd">Access your panel and roll out the campaign.</div></div>'
      +'</div>'
      +'<h3 class="sec">Final Note</h3>'
      +'<p class="t">We hope our offer is in line with your requirements and look forward to your valuable order and a long-term mutually beneficial association with your esteemed organization. If you have any questions or queries, please reach back out to us.</p>'
      +(p.valid_until?'<p class="t" style="font-size:11.5px;color:#9ca3af">This proposal is valid until '+esc(fmtDate(p.valid_until))+'.</p>':'')
      +'<div class="final"><div class="fg1"></div><div class="fg2"></div>'
      +'<div class="fhead">Ready when you are, '+esc(firstName)+'</div>'
      +'<div class="fsub">Questions, changes, or a different budget &mdash; one tap and we are on it.</div>'
      +'<div class="fbtns"><a class="fcall" href="'+telHref(callNum)+'">Call Us</a><a class="fwa" href="'+waHref(waNum)+'" target="_blank" rel="noopener">WhatsApp</a></div>'
      +'<a class="fpdf" onclick="downloadPdf();return false;" href="#">Download proposal as PDF</a>'
      +(sigLine?'<div class="fsig">'+sigLine+'</div>':'')
      +'</div>'
      +'<h4 class="tc">Terms &amp; Conditions</h4>'
      +'<ul class="tcl">'
      +'<li>By taking our services, you agree to all T&amp;Cs at <a href="https://www.adviuz.ca/terms-condtions" target="_blank" rel="noopener">adviuz.ca/terms-condtions</a></li>'
      +'<li>All payments are full and final and non-refundable.</li>'
      +'<li>Adviuz does not guarantee business profit or loss through advertisements.</li>'
      +'<li>Taxes are extra.</li>'
      +'</ul>'
      +'</div>'
      +'<div class="foot">'
      +'<div class="ftn">Sales Team</div>'
      +'<div class="fh">Monday to Friday &middot; 10:00 AM &ndash; 6:00 PM CST</div>'
      +'<div><a class="pill web" href="https://adviuz.ca" target="_blank" rel="noopener">adviuz.ca</a><a class="pill tel" href="'+telHref(callNum)+'">'+esc(callNum)+'</a></div>'
      +'<div class="legal">&copy; 2026 <strong style="color:#777">Adviuz</strong>. Instad Web Services Limited, Unit 400, Scotiabank Building, 111 2nd Avenue South, Saskatoon, SK S7K 1K6</div>'
      +'</div>';
    el.innerHTML = h;
    document.title = (c.subject||c.header_label||'Proposal') + ' — Adviuz';
    // PDF file name: Adviuz_<Client>_<ProposalName>_Proposal (same rule as proposal-pdf fn)
    window._propName = (function(){
      var cl=String(p.company||p.lead_name||'Client').trim().split(/\s+/)[0].replace(/[^A-Za-z0-9]/g,'')||'Client';
      var hd=String(c.header_label||'').replace(/proposal/ig,' ').replace(/[^A-Za-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean).join('_');
      return ('Adviuz_'+cl+(hd?'_'+hd:'')+'_Proposal').slice(0,90);
    })();
    if(qs.get('pdf')==='1') setTimeout(downloadPdf, 300);
  }

  // ── Real PDF download ──
  // One tall page that looks exactly like this web page, with every button
  // and link (Choose this package, Call Us, WhatsApp, Learn More) clickable.
  // Libraries load only when someone asks for the PDF.
  function loadJs(urls){
    return new Promise(function(res, rej){
      (function next(i){
        if(i>=urls.length) return rej(new Error('load'));
        var sc=document.createElement('script'); sc.src=urls[i];
        sc.onload=function(){ res(); }; sc.onerror=function(){ sc.remove(); next(i+1); };
        document.head.appendChild(sc);
      })(0);
    });
  }
  var _pdfBusy=false;
  window.downloadPdf = async function(){
    if(_pdfBusy) return; _pdfBusy=true;
    var wait=document.createElement('div'); wait.className='pdfwait'; wait.innerHTML='<i></i>Preparing your PDF&hellip;';
    document.body.appendChild(wait);
    var y=window.scrollY;
    try{
      if(!window.html2canvas) await loadJs(['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js']);
      if(!(window.jspdf&&window.jspdf.jsPDF)) await loadJs(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js']);
      // make sure the logo has loaded before capturing
      await Promise.all(Array.prototype.map.call(el.querySelectorAll('img'), function(im){
        return im.complete ? 0 : new Promise(function(r){ im.onload=im.onerror=r; });
      }));
      document.body.classList.add('pdfmode');
      window.scrollTo(0,0);
      var W=560, H=Math.ceil(el.scrollHeight);
      var base=el.getBoundingClientRect();
      var links=[];
      Array.prototype.forEach.call(el.querySelectorAll('a[href]'), function(a){
        var href=a.getAttribute('href')||''; if(!href || href==='#') return;
        var r=a.getBoundingClientRect(); if(!r.width||!r.height) return;
        links.push({ x:r.left-base.left, y:r.top-base.top, w:r.width, h:r.height, url:a.href });
      });
      // stay under mobile canvas limits (~16M pixels)
      var scale=Math.min(2, Math.sqrt(15000000/(W*H)));
      var canvas=await window.html2canvas(el, { scale:scale, useCORS:true, backgroundColor:'#ffffff', width:W, height:H, windowWidth:W, scrollX:0, scrollY:0, logging:false });
      var pdf=new window.jspdf.jsPDF({ orientation:'portrait', unit:'px', format:[W,H], hotfixes:['px_scaling'], compress:true });
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, W, H);
      links.forEach(function(k){ pdf.link(k.x, k.y, k.w, k.h, { url:k.url }); });
      var nm=window._propName||'Adviuz_Proposal';
      pdf.save(nm+'.pdf');
    }catch(e){
      alert('Could not create the PDF right now — please try again.');
    }
    document.body.classList.remove('pdfmode');
    window.scrollTo(0,y);
    wait.remove(); _pdfBusy=false;
  };
})();
</script>
