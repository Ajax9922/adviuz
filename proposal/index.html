<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Proposal — Adviuz</title>
<link rel="icon" type="image/png" href="/brand/favicon-32.png">
<style>
  :root{ --text:#111318; --sub:#6b7280; --line:#e5e7eb; --green:#15803d; --brand:#230835; --accent:#4000f3; --pink:#e65afc; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:Helvetica,Arial,sans-serif; }
  body{ background:#f0f2f5; padding:24px 12px 60px; display:flex; justify-content:center; }
  .page{ width:100%; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(16,10,40,.08); }
  .hair{ height:5px; background:linear-gradient(90deg,var(--accent),var(--pink)); }
  .head{ display:flex; align-items:center; justify-content:space-between; padding:15px 22px; border-bottom:1px solid #eeeeee; }
  .head img{ height:16px; display:block; }
  .est2014{ font-size:10px; color:#9a9a9a; letter-spacing:.3px; }
  .hlabel{ font-size:11px; font-weight:700; letter-spacing:.16em; color:#9a9a9a; text-transform:uppercase; }
  .body{ padding:24px 26px 28px; }
  .to p{ font-size:13px; color:#222; margin:0 0 4px; }
  .to .co{ font-size:14px; font-weight:700; color:#111827; margin:0 0 10px; }
  .subject{ font-size:15px; font-weight:700; color:#111827; margin:16px 0 14px; }
  p.t{ font-size:13px; color:#4b5563; line-height:1.7; margin:0 0 12px; }
  .custom{ background:#faf8ff; border-left:3px solid var(--accent); padding:10px 14px; font-size:13px; color:#3b3355; line-height:1.7; margin:0 0 14px; }
  h3.sec{ margin:24px 0 10px; font-size:15px; font-weight:700; color:#111827; border-bottom:1px solid #e5e7eb; padding-bottom:6px; }
  ul.plain{ margin:0 0 4px; padding-left:20px; font-size:13px; color:#374151; line-height:1.9; }
  .mng{ border:1px solid #e6dcf7; background:#faf8ff; border-radius:12px; padding:14px 16px; }
  .mngt{ font-size:13.5px; font-weight:700; color:#111827; margin-bottom:9px; }
  .mrow{ display:flex; gap:9px; align-items:baseline; font-size:12.5px; color:#4b5563; padding:4px 0; line-height:1.5; }
  .mx{ color:#b91c1c; font-weight:800; font-size:11px; flex-shrink:0; }
  .mclose{ border-top:1px solid #ece5f9; margin-top:10px; padding-top:10px; font-size:12.5px; font-weight:700; color:#111827; line-height:1.55; }
  .pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pcat{ border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:#fff; }
  .pcat.wide{ grid-column:1 / -1; }
  .pcat .ph{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .pcat .pic{ width:26px; height:26px; border-radius:8px; background:#f3efff; color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pcat .pt{ font-size:12px; font-weight:700; color:#111827; letter-spacing:.02em; }
  .pcat .pi{ font-size:11.5px; color:#4b5563; line-height:1.5; padding:3px 0; display:flex; gap:6px; align-items:baseline; }
  .pcat .pi:before{ content:''; width:5px; height:5px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--pink)); flex-shrink:0; position:relative; top:-1px; }
  .flow{ position:relative; padding-left:6px; }
  .fstep{ display:flex; gap:13px; position:relative; padding-bottom:18px; }
  .fstep:last-child{ padding-bottom:2px; }
  .fstep:not(:last-child):before{ content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:#ece5f9; }
  .fnum{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--pink)); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; }
  .ft2{ padding-top:4px; }
  .ft2 .a{ font-size:13.5px; font-weight:700; color:#111827; }
  .ft2 .b{ font-size:12px; color:#6b7280; line-height:1.6; margin-top:2px; }
  .pk{ border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:16px; }
  .pk.rec{ border:1.5px solid var(--accent); }
  .pkh{ height:4px; background:linear-gradient(90deg,var(--accent),var(--pink)); }
  .pkb{ padding:20px 22px 22px; }
  .pktop{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .pkn{ font-size:15px; font-weight:700; color:#111827; padding-top:2px; }
  .badge{ display:inline-block; vertical-align:2px; background:var(--brand); color:#fff; font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:99px; margin-left:5px; white-space:nowrap; }
  .pkp{ text-align:right; }
  .pkp .amt{ font-size:19px; font-weight:750; color:#111827; }
  .pkp .tax{ font-size:10px; color:#9ca3af; }
  .pkdesc{ font-size:12px; color:#6b7280; margin-top:6px; line-height:1.6; }
  .plabel{ font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--green); margin:16px 0 10px; border-top:1px solid #eef0f3; padding-top:15px; }
  .prow{ display:flex; gap:10px; align-items:baseline; font-size:13px; color:#374151; margin-bottom:9px; line-height:1.55; }
  .prow b{ font-weight:700; color:#111827; }
  .tick{ color:var(--green); font-weight:700; font-size:11px; }
  .validity{ font-size:10.5px; color:#9ca3af; margin-top:12px; }
  .pkbtn{ display:block; text-align:center; background:var(--brand); color:#fff; font-size:13px; font-weight:700; padding:13px; border-radius:10px; margin-top:16px; text-decoration:none; }
  .pk.rec .pkbtn{ background:var(--accent); }
  .budget{ font-size:12px; color:#6b7280; text-align:center; line-height:1.6; margin:2px 0 0; }
  .lmgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lmcard{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:12px 13px; text-decoration:none; background:#fff; }
  .lmic{ width:30px; height:30px; border-radius:50%; background:#f3efff; color:#4000f3; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .lmt{ display:block; font-size:12.5px; font-weight:700; color:#111827; }
  .lms{ display:block; font-size:10.5px; color:#6b7280; margin-top:1px; }
  .hsgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hscard{ border:1px solid var(--line); border-radius:12px; padding:12px 13px; background:#fff; }
  .hsnum{ display:inline-flex; width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#4000f3,#e65afc); color:#fff; font-size:12px; font-weight:800; align-items:center; justify-content:center; margin-bottom:7px; }
  .hst{ font-size:12.5px; font-weight:700; color:#111827; }
  .hsd{ font-size:11px; color:#6b7280; margin-top:2px; line-height:1.5; }
  .final{ border:1px solid #e6dcf7; border-radius:16px; background:#fff; padding:22px 18px; text-align:center; position:relative; overflow:hidden; margin-top:20px; }
  .fg1{ position:absolute; right:-50px; top:-50px; width:170px; height:170px; border-radius:50%; background:radial-gradient(circle,rgba(230,90,252,.10),transparent 70%); }
  .fg2{ position:absolute; left:-50px; bottom:-60px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,rgba(64,0,243,.08),transparent 70%); }
  .fhead{ font-size:16.5px; font-weight:700; color:#111318; letter-spacing:-.01em; position:relative; }
  .fsub{ font-size:12px; color:#6b7280; margin:5px 0 16px; line-height:1.55; position:relative; }
  .fbtns{ display:grid; grid-template-columns:1fr 1fr; gap:9px; position:relative; }
  .fcall{ display:block; text-align:center; background:linear-gradient(90deg,#4000f3,#e65afc); color:#fff; font-size:13px; font-weight:700; padding:13px 4px; border-radius:10px; text-decoration:none; }
  .fwa{ display:block; text-align:center; background:#25D366; color:#fff; font-size:13px; font-weight:700; padding:13px 4px; border-radius:10px; text-decoration:none; }
  .fpdf{ display:block; text-align:center; background:#fff; border:1.5px solid #e6dcf7; color:#4000f3; font-size:12.5px; font-weight:700; padding:11px; border-radius:10px; text-decoration:none; margin-top:9px; position:relative; cursor:pointer; }
  .fsig{ font-size:11px; color:#6b7280; margin-top:14px; position:relative; }
  .fsig b{ color:#111318; }
  h4.tc{ margin:26px 0 8px; font-size:13px; font-weight:700; color:#111827; border-bottom:1px solid #e5e7eb; padding-bottom:6px; }
  ul.tcl{ margin:0; padding-left:18px; font-size:10.5px; color:#9ca3af; line-height:1.8; }
  ul.tcl a{ color:#9ca3af; }
  .foot{ background:#fafafa; border-top:1px solid #eeeeee; padding:20px 16px; text-align:center; }
  .ftn{ font-size:13px; font-weight:700; color:#111; margin-bottom:2px; }
  .fh{ font-size:11px; color:#999; margin-bottom:12px; }
  .pill{ display:inline-block; background:#fff; border:1px solid #e2e2e2; border-radius:999px; padding:8px 16px; margin:3px; font-size:12px; text-decoration:none; }
  .pill.web{ color:var(--accent); } .pill.tel{ color:#444; }
  .legal{ border-top:1px solid #e8e8e8; margin-top:12px; padding-top:12px; font-size:10.5px; color:#9a9a9a; line-height:1.6; }
  .loading{ text-align:center; padding:80px 20px; color:#6b7280; font-size:14px; }
  @media print{
    body{ background:#fff; padding:0; }
    .page{ box-shadow:none; border:none; max-width:none; border-radius:0; }
    .fpdf, .fbtns, .prevbar{ display:none!important; }
    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
    .tax, .validity, ul.tcl, ul.tcl a, .fh, .legal, .est2014, .fsub, .fsig, .budget{ color:#4b5563!important; }
    p.t{ color:#374151!important; }
    .pkbtn{ background:#230835!important; color:#fff!important; }
  }
</style>
</head>
<body>
<div class="page" id="page"><div class="loading">Loading your proposal&hellip;</div></div>
<script>
(function(){
  var FN = 'https://crhvvfomwkrgwlnfruad.supabase.co/functions/v1/proposal-data';
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
  function telHref(n){ return 'tel:'+String(n||'').replace(/[^0-9+]/g,''); }
  function waHref(n){ return 'https://wa.me/'+String(n||'').replace(/[^0-9]/g,''); }
  function fmtDate(d){ try{ return new Date(d+'T12:00:00').toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'}); }catch(e){ return d||''; } }

  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || '';
  var isPrev = qs.get('preview') === '1';
  var el = document.getElementById('page');

  function fail(msg){ el.innerHTML = '<div class="loading">'+esc(msg)+'</div>'; }

  if(!id){ fail('This proposal link is incomplete — please use the link from your email or message.'); return; }

  if(isPrev){
    var pb=document.createElement('button');
    pb.className='prevbar';
    pb.innerHTML='&#10005;&nbsp; Close preview';
    pb.setAttribute('style','position:fixed;top:12px;right:12px;z-index:99;background:#230835;color:#fff;border:none;border-radius:99px;padding:10px 16px;font-size:13px;font-weight:700;font-family:inherit;box-shadow:0 4px 14px rgba(16,10,40,.3);cursor:pointer');
    pb.onclick=function(){ if(history.length>1) history.back(); else window.close(); };
    document.body.appendChild(pb);
  }

  fetch(FN+'?id='+encodeURIComponent(id)+(isPrev?'&preview=1':'')).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.ok || !j.proposal){ fail('We could not find this proposal. It may have been replaced — please contact us.'); return; }
    render(j.proposal);
  }).catch(function(){ fail('Could not load the proposal right now — please try again in a moment.'); });

  function pkgCard(p){
    var badge = p.badge ? '<span class="badge"'+(p.badge==='Pilot Campaign'||p.badge==='Pilot'?' style="background:#6b7280"':(p.badge==='Start Dominating'?' style="background:#4000f3"':''))+'>'+esc(p.badge)+'</span>' : '';
    var rec = p.badge==='Recommended' ? ' rec' : '';
    return '<div class="pk'+rec+'"><div class="pkh"></div><div class="pkb">'
      +'<div class="pktop"><div class="pkn">'+esc(p.views)+' Flyer Views'+badge+'</div><div class="pkp"><div class="amt">'+esc(p.price)+'</div><div class="tax">CAD + applicable tax</div></div></div>'
      +(p.desc?'<div class="pkdesc">'+esc(p.desc)+'</div>':'')
      +'<div class="plabel">Limited period offer includes</div>'
      +'<div class="prow"><span class="tick">&#10003;</span><span>Full access to <b>Adviuz AI Conversion Engine</b></span></div>'
      +'<div class="prow"><span class="tick">&#10003;</span><span><b>'+esc(p.ai)+'</b> AI minutes</span></div>'
      +'<div class="prow"><span class="tick">&#10003;</span><span><b>'+esc(p.x)+'</b> SMS &middot; <b>'+esc(p.x)+'</b> Emails &middot; <b>'+esc(p.x)+'</b> Call Minutes</span></div>'
      +'<div class="prow"><span class="tick">&#10003;</span><span>Design editing for <b>'+esc(p.dm)+'</b></span></div>'
      +(p.validity?'<div class="validity">Package validity &mdash; '+esc(p.validity)+'</div>':'')
      +(p.link?'<a class="pkbtn" href="'+esc(p.link)+'" target="_blank" rel="noopener">Choose this package &rarr;</a>':'')
      +'</div></div>';
  }
  function lmCard(href, icon, t, sub){
    if(!href) return '';
    return '<a class="lmcard" href="'+esc(href)+'" target="_blank" rel="noopener"><span class="lmic">'+icon+'</span><span><span class="lmt">'+esc(t)+'</span><span class="lms">'+esc(sub)+'</span></span></a>';
  }

  function render(p){
    var c = p.content || {};
    var links = c.links || {};
    var sig = c.sig || {};
    var firstName = (p.lead_name||'there').split(' ')[0];
    var callNum = c.call_number || '+1 (672) 203-8220';
    var waNum = c.wa_number || callNum;
    var pkgs = Array.isArray(c.packages) ? c.packages : [];
    var sigParts = [];
    if(sig.name) sigParts.push('<b>'+esc(sig.name)+'</b>'+(sig.title?' ('+esc(sig.title)+')':''));
    if(sig.phone) sigParts.push(esc(sig.phone));
    if(sigParts.length) sigParts.push('Monday to Friday &middot; 10:00 AM &ndash; 6:00 PM CST');
    var sigLine = sigParts.join(' &nbsp;|&nbsp; ');

    var icPlay='<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
    var icUser='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    var icImg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    var icPen='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>';

    var h = '<div class="hair"></div>'
      +'<div class="head"><div style="display:flex;align-items:flex-end;gap:7px"><img src="/brand/adviuz-logo-black.png" alt="Adviuz"><span class="est2014">|&nbsp; Est. 2014</span></div>'
      +'<div class="hlabel">'+esc(c.header_label||'Proposal')+'</div></div>'
      +'<div class="body">'
      +'<div class="to"><p>To,</p><p class="co">'+esc(p.company||p.lead_name||'')+'</p><p>Kind Attention,</p><p>'+esc(p.lead_name||'')+'</p></div>'
      +'<div class="subject">Subject &ndash; '+esc(c.subject||'New Flyers Distribution System')+'</div>'
      +'<p class="t">The Adviuz Flyers Distribution System is a unique, state-of-the-art distribution system that circulates flyers across all major digital advertising platforms in a single click, and charges you only for the flyers that get opened and viewed for at least 25 seconds.</p>'
      +'<p class="t">Apart from this, the system also has the option to manage all inbound inquiries in one place, so you can easily work on them to close deals.</p>'
      +(c.goal?'<div class="custom">'+esc(c.goal)+'</div>':'')
      +'<h3 class="sec">First Time Ever</h3>'
      +'<ul class="plain">'
      +'<li>$0.00 Printing Cost</li>'
      +'<li>100% Distribution Guarantee</li>'
      +'<li>Get Instant Replies &amp; Feedback</li>'
      +'<li>Audience Targeting Options Available</li>'
      +'<li>Get charged only if the flyer gets viewed for 25 seconds</li>'
      +'<li>Fully Managed Marketing &amp; Tele-calling &mdash; done for you</li>'
      +'<li>Launch on All Major Digital Platforms in a Single Click</li>'
      +'</ul>'
      +'<h3 class="sec">Circulation Platforms</h3>'
      +'<div class="pgrid">'
      +'<div class="pcat"><div class="ph"><span class="pic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2h-3a5 5 0 0 0-5 5v3H6v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></span><span class="pt">Social Media</span></div>'
      +'<div class="pi">Facebook &mdash; Feed &amp; Messenger</div><div class="pi">Instagram &mdash; Feed &amp; Sponsored</div><div class="pi">Reels &mdash; Instagram &amp; Facebook</div><div class="pi">Status &mdash; WhatsApp, FB &amp; IG</div><div class="pi">LinkedIn &middot; X (Twitter) &middot; TikTok</div></div>'
      +'<div class="pcat"><div class="ph"><span class="pic">'+icPlay+'</span><span class="pt">Video</span></div>'
      +'<div class="pi">YouTube Ads</div><div class="pi">YouTube Shorts</div><div class="pi">Discovery Ads</div></div>'
      +'<div class="pcat"><div class="ph"><span class="pic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><span class="pt">Direct Reach</span></div>'
      +'<div class="pi">SMS Campaigns</div><div class="pi">Sponsored Emails</div></div>'
      +'<div class="pcat"><div class="ph"><span class="pic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span><span class="pt">Web &amp; Apps</span></div>'
      +'<div class="pi">Display Network Ads</div><div class="pi">Mobile App Pop-up Ads</div><div class="pi">Remarketing Ads</div></div>'
      +'<div class="pcat wide"><div class="ph"><span class="pic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0V9"/><line x1="12" y1="7" x2="17" y2="7"/><line x1="12" y1="11" x2="17" y2="11"/><line x1="11" y1="15" x2="17" y2="15"/></svg></span><span class="pt">Premium News Platforms</span></div>'
      +'<div class="pi">CNN &middot; Fox News &middot; The New York Times &middot; CNBC &middot; Global News</div></div>'
      +'</div>'
      +'<p style="font-size:12px;color:#6b7280;line-height:1.65;margin:12px 0 0;font-style:italic">Not every platform fits every business &mdash; we hand-pick and prioritize the platforms best suited to your campaign, audience and goals.</p>'
      +'<h3 class="sec">What Happens After You Go Live</h3>'
      +'<div class="flow">'
      +'<div class="fstep"><div class="fnum">1</div><div class="ft2"><div class="a">Digital flyer circulated</div><div class="b">Your flyer goes live across all the platforms above and reaches your target audience.</div></div></div>'
      +'<div class="fstep"><div class="fnum">2</div><div class="ft2"><div class="a">Views turn into leads</div><div class="b">Interested viewers respond &mdash; every lead lands instantly in your live dashboard.</div></div></div>'
      +'<div class="fstep"><div class="fnum">3</div><div class="ft2"><div class="a">AI reaches out within minutes</div><div class="b">The Adviuz AI Conversion Engine calls, texts and emails every new lead right away &mdash; while the interest is hot.</div></div></div>'
      +'<div class="fstep"><div class="fnum">4</div><div class="ft2"><div class="a">Follow-ups never stop</div><div class="b">Automatic follow-ups by call, SMS and email continue until the lead books a meeting with you.</div></div></div>'
      +'<div class="fstep"><div class="fnum">5</div><div class="ft2"><div class="a">You close the deal</div><div class="b">You walk into a booked meeting with a warm lead &mdash; and close.</div></div></div>'
      +'</div>'
      +'<h3 class="sec">100% Managed &mdash; We Run It, You Close Deals</h3>'
      +'<div class="mng"><div class="mngt">With Adviuz, you never have to:</div>'
      +'<div class="mrow"><span class="mx">&#10007;</span>Manage or optimize ad campaigns</div>'
      +'<div class="mrow"><span class="mx">&#10007;</span>Do creative or design work</div>'
