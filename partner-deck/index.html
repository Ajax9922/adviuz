<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adviuz Presentation</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c0b38">
<link rel="icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14081f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.top img{height:22px}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:600 14px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:999px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.p{background:linear-gradient(90deg,#4000f3,#c04bf5);border-color:transparent}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;position:relative;min-height:0}
.frame{position:relative;width:min(100%,calc((100dvh - 150px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#fbf9ff;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.frame img.on{opacity:1}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#4000f3;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.nav:disabled{opacity:.3;cursor:default}
.prev{left:22px}.next{right:22px}
.bot{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:14px;color:rgba(255,255,255,.7)}
.bar{flex:0 1 420px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4000f3,#c04bf5);transition:width .25s}
@media (max-width:700px){.nav{display:none}.bot .t{display:none}}
#num{white-space:nowrap}
.btn{font-size:14px;font-weight:600;line-height:1}
</style></head><body>
<div class="top"><img src="/brand/adviuz-logo-white.png" alt="Adviuz"><span class="sp"></span>
<a class="btn" id="pdf" href="Adviuz-Presentation.pdf" download>Download PDF</a>
<button class="btn" id="share" type="button" hidden>Share</button>
<a class="btn p" id="cta" href="https://adviuz.com/start" target="_blank" rel="noopener">See plans &amp; book a demo</a></div>
<div class="stage"><button class="nav prev" id="prev" aria-label="Previous slide">&#8249;</button>
<div class="frame" id="frame"></div>
<button class="nav next" id="next" aria-label="Next slide">&#8250;</button></div>
<div class="bot"><span id="num">1 / 1</span><span class="bar"><i id="bar"></i></span><span class="t">Swipe or use the arrow keys</span></div>
<script>
(function(){
  var ALT=["How it works: five steps, Recharge, Design, Account setup, Go live, Leads", "Step 1, Recharge: choose your flyer views and pay", "Step 2, Design: the content we need from you", "Step 2, Design: your flyer on mobile, sent for approval", "Step 3, Account setup: audience, area and platforms", "Step 4, Go live: your dashboard and the Active switch", "One button blasts your flyer on 15 platforms", "Platform 1, YouTube: ad, tap Learn more, brochure opens with the 25-second bar", "Switch apps and the 25-second bar pauses", "After 25 seconds: Inquire Now and Call Now", "Platform 2, Facebook", "Platform 3, Instagram", "Platform 4, Messenger", "Platform 5, WhatsApp Status", "Platform 6, Threads", "Platform 7, Google Display", "Platform 8, Google Discovery", "Platform 9, TikTok", "Platform 10, LinkedIn", "Platform 11, X (Twitter)", "Platform 12, News sites", "Platform 13, Mobile apps", "Platform 14, SMS", "Platform 15, Email", "One click, four results: branding, remarketing, engagement, leads", "Your leads screen: every lead in one place", "Any questions? adviuz.com, sales@adviuz.ca"], N=ALT.length, i=0, f=document.getElementById('frame'), imgs=[];
  var q=new URLSearchParams(location.search).get('ref')||'', ref=/^[A-Za-z0-9_-]{2,32}$/.test(q)?q.toUpperCase():'';
  if(ref){document.getElementById('cta').href='https://adviuz.com/s/'+encodeURIComponent(ref);}
  function src(k){return (k<9?'0':'')+(k+1)+'.webp';}
  for(var k=0;k<N;k++){var im=document.createElement('img');im.alt=ALT[k];im.decoding='async';if(k<2)im.src=src(k);f.appendChild(im);imgs.push(im);}
  function go(n){n=Math.max(0,Math.min(N-1,n));i=n;
    for(var k=0;k<N;k++){if(Math.abs(k-i)<=1&&!imgs[k].getAttribute('src'))imgs[k].src=src(k);imgs[k].classList.toggle('on',k===i);}
    document.getElementById('num').textContent=(i+1)+' / '+N;document.getElementById('bar').style.width=((i+1)/N*100)+'%';
    document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===N-1;}
  document.getElementById('prev').onclick=function(){go(i-1);};document.getElementById('next').onclick=function(){go(i+1);};
  f.onclick=function(e){var r=f.getBoundingClientRect();go(e.clientX-r.left<r.width/3?i-1:i+1);};
  addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);}});
  var x0=null;f.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  f.addEventListener('touchend',function(e){if(x0==null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(d<0?i+1:i-1);x0=null;},{passive:true});
  var sb=document.getElementById('share');
  if(navigator.share){sb.hidden=false;sb.onclick=function(){navigator.share({title:'Adviuz',text:'Here is how Adviuz digital flyers work:',url:location.href}).catch(function(){});};}
  go(0);
})();
</script></body></html>
