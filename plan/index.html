<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Adviuz Payment Plan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="https://adviuz.ca/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- plan-1 (2026-10-30): client "Manage my plan" page for quote payment plans.
     Pause up to 2 months/yr (end date moves back) · cancel = request with 30 days' notice · card update via Stripe. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#230835;--text:#111b21;--sub:#667781;--muted:#aab8c0;--border:#e2e8f0;--bg:#f7f8fa;--white:#fff;--red:#dc2626;--ok:#047857;--amber:#b45309;--f:"Inter",system-ui,sans-serif}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh}
.grad-line{height:5px;background:linear-gradient(90deg,#4000f3,#e65afc)}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:14px 20px;display:flex;align-items:flex-end;justify-content:space-between}
.logo-est{display:flex;align-items:flex-end}
.logo-est .div{color:#ddd;font-size:12px;font-weight:300;padding:0 7px;line-height:12px}
.logo-est .est{font-size:10px;color:#9a9a9a;letter-spacing:.3px;line-height:11px}
.badge{color:var(--dark);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);padding:20px}
.title{font-size:20px;font-weight:700;margin-bottom:4px}
.lead{font-size:13px;color:var(--sub)}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;margin-top:12px}
.p-active{background:#d1fae5;color:#065f46}.p-paused{background:#fef3c7;color:#92400e}.p-due{background:#fee2e2;color:#b91c1c}
.p-cancel{background:#fee2e2;color:#b91c1c}.p-done{background:#e0e7ff;color:#3730a3}
.bar{height:8px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4000f3,#e65afc);border-radius:99px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:none}.row span:first-child{color:var(--sub)}.row span:last-child{font-weight:600;text-align:right}
.sec{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-family:var(--f);font-size:15px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-dark{background:var(--dark);color:#fff}
.btn-line{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-red{background:#fff;color:var(--red);border:1.5px solid #fecaca}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
.err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:22px;text-align:center;font-size:14px}
.sheet-ov{position:fixed;inset:0;background:rgba(17,27,33,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-ov.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:#d9dde3;margin:4px auto 14px}
.sheet h3{font-size:17px;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:12px;margin-top:10px;cursor:pointer;font-size:14px}
.opt.sel{border-color:#4000f3;background:#f5f3ff}
.opt b{display:block}
textarea{width:100%;min-height:80px;border:1.5px solid var(--border);border-radius:12px;padding:12px;font-family:var(--f);font-size:14px;margin-top:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90%}
.foot{text-align:center;font-size:11px;color:var(--muted);line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<div class="grad-line"></div>
<div class="topbar">
  <div class="logo-est"><img src="https://hub.adviuz.ca/brand/adviuz-logo-black.png" alt="Adviuz" style="height:16px;display:block"><span class="div">|</span><span class="est">Est. 2014</span></div>
  <div class="badge">Payment plan</div>
</div>
<div class="wrap" id="main"><div class="card" style="text-align:center;color:var(--sub);font-size:14px">Loading your plan…</div></div>

<div class="sheet-ov" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
var FN = "https://crhvvfomwkrgwlnfruad.supabase.co/functions/v1/quote-installments";
var T = new URLSearchParams(location.search).get("t") || "";
var P = null, busy = false, pauseMonths = 1;

function money(n){ return "CAD $" + Number(n||0).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function day(iso){ if(!iso) return "—"; var d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}); }
function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display="none";},3800); }

async function api(method, body){
  var r = await fetch(FN+"?action=manage&t="+encodeURIComponent(T), { method:method, headers:{"Content-Type":"application/json"}, body: body?JSON.stringify(body):undefined });
  var j = await r.json().catch(function(){return {};});
  if(!r.ok || j.error) throw new Error(j.error || ("Error "+r.status));
  return j;
}
async function load(){
  if(!/^[0-9a-f]{64}$/.test(T)){ return fail("This link isn't valid. Please use the link from your email."); }
  try{ var j = await api("GET"); P = j.plan; render(); }
  catch(e){ fail(e.message); }
}
function fail(m){ document.getElementById("main").innerHTML = "<div class='err'>"+esc(m)+"<div style='margin-top:10px;font-size:12px'>Need help? <a href='mailto:accounts@adviuz.com' style='color:#991b1b'>accounts@adviuz.com</a></div></div>"; }

function statusPill(p){
  var m = { active:["Active","p-active"], paused:["Paused","p-paused"], past_due:["Payment failed — update card","p-due"],
            cancel_requested:["Cancellation requested","p-cancel"], cancel_scheduled:["Ending "+day(p.cancel_effective_at),"p-cancel"],
            cancelled:["Cancelled","p-cancel"], completed:["Completed — fully paid","p-done"] }[p.status] || [p.status,"p-active"];
  return "<span class='pill "+m[1]+"'>"+m[0]+"</span>";
}
function render(){
  var p = P, pct = Math.round(100 * p.payments_made / Math.max(1,p.total_payments));
  var every = p.interval_months===3 ? "every 3 months" : "monthly";
  var live = ["active","paused","past_due","cancel_requested","cancel_scheduled"].indexOf(p.status) >= 0;
  var h = "<div class='card'>"
    + "<div class='title'>"+esc(p.biz||"Your plan")+"</div>"
    + "<div class='lead'>"+esc(p.item||"")+"</div>"
    + statusPill(p)
    + "<div class='bar'><i style='width:"+pct+"%'></i></div>"
    + "<div class='lead'><b style='color:var(--text)'>"+p.payments_made+" of "+p.total_payments+"</b> payments made</div>"
    + "</div>";
  h += "<div class='card'><div class='sec'>Plan details</div>"
    + "<div class='row'><span>Payment</span><span>"+money(p.per_payment)+" "+every+"</span></div>"
    + "<div class='row'><span>Total</span><span>"+money(p.total)+"</span></div>"
    + (p.status==="paused" && p.paused_until ? "<div class='row'><span>Paused until</span><span>"+day(p.paused_until)+"</span></div>" : "")
    + (live && p.next_payment_at && p.status!=="cancel_scheduled" ? "<div class='row'><span>Next payment</span><span>"+day(p.next_payment_at)+"</span></div>" : "")
    + (p.status==="cancel_scheduled" ? "<div class='row'><span>Plan ends</span><span>"+day(p.cancel_effective_at)+"</span></div>" : "")
    + (p.status==="completed" ? "<div class='row'><span>Status</span><span>No more charges</span></div>" : (live ? "<div class='row'><span>Ends</span><span>Automatically after payment "+p.total_payments+"</span></div>" : ""))
    + "</div>";
  if(live){
    h += "<div class='card'><div class='sec'>Manage</div>";
    h += "<button class='btn btn-dark' onclick='card()'>Update my card</button>";
    if(p.status==="paused") h += "<button class='btn btn-line' onclick='resume()'>Resume payments now</button>";
    else if((p.status==="active"||p.status==="past_due") && p.interval_months===1 && p.pause_months_left>0) h += "<button class='btn btn-line' onclick='openPause()'>Pause my plan</button>";
    if(p.status==="active"||p.status==="paused"||p.status==="past_due") h += "<button class='btn btn-red' onclick='openCancel()'>Request cancellation</button>";
    h += "<div class='note'>"
      + (p.interval_months===1 ? "You can pause for up to 2 months a year — "+p.pause_months_left+" month"+(p.pause_months_left===1?"":"s")+" left. Paused months move your end date back; your total stays the same.<br>" : "")
      + (p.status==="cancel_requested" ? "We've received your cancellation request ("+day(p.cancel_requested_at)+"). Our accounts team will confirm by email." : "Cancellation needs 30 days' notice. Payments due within the notice period are still charged.")
      + "</div></div>";
  }
  h += "<div class='foot'>Payments are processed securely by Stripe.<br>Questions? <a href='mailto:accounts@adviuz.com' style='color:#4000f3;text-decoration:none'>accounts@adviuz.com</a> · +1 647 250 1152<br>Instad Web Services Limited · Saskatoon, SK</div>";
  document.getElementById("main").innerHTML = h;
}

function openSheet(html){ document.getElementById("sheetBody").innerHTML = "<div class='grab'></div>"+html; document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }

function openPause(){
  pauseMonths = 1;
  var left = P.pause_months_left;
  openSheet("<h3>Pause my plan</h3><div class='lead'>No charge during the pause. Your plan simply ends later — all "+P.total_payments+" payments stay the same.</div>"
    + "<div class='opt sel' id='pm1' onclick='pickPause(1)'><div><b>Pause 1 month</b><span class='lead'>Skip the "+day(P.next_payment_at)+" payment</span></div></div>"
    + (left>=2 ? "<div class='opt' id='pm2' onclick='pickPause(2)'><div><b>Pause 2 months</b><span class='lead'>Skip the next two payments</span></div></div>" : "")
    + "<button class='btn btn-dark' id='goBtn' onclick='doPause()'>Confirm pause</button><button class='btn btn-line' onclick='closeSheet()'>Not now</button>");
}
function pickPause(n){ pauseMonths=n; ["pm1","pm2"].forEach(function(id,i){ var el=document.getElementById(id); if(el) el.classList.toggle("sel", i+1===n); }); }
async function doPause(){ await run({op:"pause", months:pauseMonths}, "Your plan is paused. A confirmation email is on its way."); }
async function resume(){ await run({op:"resume"}, "Payments resumed."); }
function openCancel(){
  openSheet("<h3>Request cancellation</h3><div class='lead'>Your agreement needs 30 days' notice. Payments due in that time are still charged; nothing after. Our accounts team will confirm by email.</div>"
    + (P.interval_months===1 && P.status!=="paused" && P.pause_months_left>0 ? "<div class='note' style='background:#f5f3ff;border-radius:10px;padding:10px 12px;color:#4c1d95'>Just need a break? You can <a href='#' onclick='closeSheet();openPause();return false' style='color:#4000f3'>pause instead</a> — up to "+P.pause_months_left+" month"+(P.pause_months_left===1?"":"s")+".</div>" : "")
    + "<textarea id='why' placeholder='Optional — tell us why (helps us improve)'></textarea>"
    + "<button class='btn btn-red' id='goBtn' onclick='doCancel()'>Send cancellation request</button><button class='btn btn-line' onclick='closeSheet()'>Keep my plan</button>");
}
async function doCancel(){ await run({op:"cancel_request", reason:(document.getElementById("why")||{}).value||""}, "Request sent. We'll confirm by email."); }
async function card(){
  if(busy) return; busy = true; toast("Opening secure card page…");
  try{ var j = await api("POST",{op:"card"}); location.href = j.url; }
  catch(e){ toast(e.message); } finally { busy = false; }
}
async function run(body, okMsg){
  if(busy) return; busy = true;
  var b = document.getElementById("goBtn"); if(b){ b.disabled = true; b.textContent = "Please wait…"; }
  try{ var j = await api("POST", body); P = j.plan; closeSheet(); render(); toast(okMsg); }
  catch(e){ toast(e.message); if(b){ b.disabled=false; b.textContent="Try again"; } }
  finally { busy = false; }
}
load();
</script>
</body>
</html>
