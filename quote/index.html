<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Adviuz Quote</title>
<meta name="description" content="Review and pay your Adviuz quote securely online.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title"       content="Your Adviuz Quote">
<meta property="og:description" content="Review and pay your Adviuz quote securely online.">
<meta property="og:image"       content="https://adviuz.ca/og-image.jpg">
<meta property="og:type"        content="website">
<meta name="theme-color"        content="#ffffff">
<link rel="icon" type="image/png" href="https://adviuz.ca/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#00a884;--dark:#230835;--text:#111b21;--sub:#667781;--muted:#aab8c0;--border:#e2e8f0;--bg:#f7f8fa;--white:#fff;--red:#dc2626;--f:"Inter",system-ui,sans-serif}
body{font-family:var(--f);background:var(--bg);color:var(--text);min-height:100vh}
.grad-line{height:5px;background:linear-gradient(90deg,#4000f3,#e65afc)}
.topbar{background:#ffffff;border-bottom:1px solid #eeeeee;padding:14px 24px;display:flex;align-items:flex-end;justify-content:space-between}
.logo-est{display:flex;align-items:flex-end}
.logo-est .div{color:#dddddd;font-size:12px;font-weight:300;padding:0 7px;line-height:12px}
.logo-est .est{font-size:10px;color:#9a9a9a;letter-spacing:.3px;white-space:nowrap;line-height:11px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.tb-btn{padding:8px 14px;border-radius:9px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;transition:background .1s}
.tb-btn:active{background:rgba(255,255,255,.15)}
.tb-btn.whatsapp{background:#25D366;border-color:#25D366}
.tb-btn.whatsapp:active{background:#1da851}
.logo-mark{width:32px;height:32px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff}
.logo-text{color:#fff;font-size:16px;font-weight:600}
.logo-sub{color:rgba(255,255,255,.35);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.q-badge{color:#230835;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:16px}
.status-pill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600}
.s-draft{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.s-sent,.s-viewed{background:#dbeafe;color:#1d4ed8}
.s-accepted{background:#d1fae5;color:#065f46}
.s-paid{background:var(--green);color:#fff}
.s-rejected,.s-expired{background:#fee2e2;color:#dc2626}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 80px}
.card{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card-body{padding:22px 24px}
.section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.q-header{display:flex;gap:20px;flex-wrap:wrap}
.q-meta{flex:1;min-width:180px}
.q-num{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px}
.q-dates{font-size:13px;color:var(--sub);line-height:2}
.q-dates strong{color:var(--text)}
.prepared{flex:1;min-width:180px;background:var(--bg);border-radius:10px;padding:16px}
.biz-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.biz-addr{font-size:13px;color:var(--sub);line-height:1.7}
.items-table{width:100%;border-collapse:collapse}
.items-table thead td{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 0;border-bottom:1px solid var(--border)}
.items-table thead td:last-child{text-align:right}
.items-table tbody td{padding:14px 0;font-size:14px;color:var(--text);border-bottom:1px solid var(--border)}
.items-table tbody td:last-child{text-align:right;font-weight:600}
.items-table tbody tr:last-child td{border-bottom:none}
.totals{margin-top:16px;border-top:2px solid var(--text)}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.total-row.grand{padding-top:12px;border-top:1px solid var(--border);font-size:18px;font-weight:700;color:var(--text)}
.pay-section{background:#4000f3;background:linear-gradient(135deg,#4000f3,#e65afc);border-radius:14px;padding:24px;text-align:center;margin-bottom:14px}
.pay-amount-lbl{color:rgba(255,255,255,.75);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pay-total{color:#fff;font-size:32px;font-weight:700;margin-bottom:20px}
.btn-pay{display:block;padding:16px;border-radius:12px;background:#ffffff;color:#230835;border:none;font-family:var(--f);font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-bottom:10px;transition:opacity .1s}
.btn-accept{display:block;padding:12px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.35);font-family:var(--f);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;width:100%}
.secure-note{font-size:11px;color:rgba(255,255,255,.55);margin-top:12px}
.stripe-note{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:14px;font-size:12px;color:var(--sub);line-height:1.7;text-align:center}
.paid-banner{background:linear-gradient(135deg,#065f46,#047857);border-radius:14px;padding:28px;text-align:center;margin-bottom:14px}
.paid-icon{font-size:44px;margin-bottom:10px}
.paid-title{font-size:22px;font-weight:600;color:#fff;margin-bottom:6px}
.paid-sub{font-size:14px;color:rgba(255,255,255,.75)}
.sched-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.sched-row:last-child{border-bottom:none}
.bank-table{width:100%;border-collapse:collapse}
.bank-table tr td{padding:9px 0;font-size:13px;border-bottom:1px solid var(--bg)}
.bank-table tr td:first-child{color:var(--sub);width:45%}
.bank-table tr td:last-child{font-weight:600;color:var(--text);text-align:right}
.bank-table tr:last-child td{border-bottom:none}
.bank-ref{background:var(--bg);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--sub);margin-top:12px;line-height:1.6}
.footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px 24px;background:var(--bg);border-top:1px solid var(--border)}
.footer-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.footer-val{font-size:12px;color:var(--sub);line-height:1.9}
.footer-bottom{padding:14px 24px;text-align:center;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.error-card{background:#fee2e2;border-radius:14px;padding:32px;text-align:center;margin:40px 0}
.share-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.share-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:12px;font-family:var(--f);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;border:none;transition:opacity .15s;white-space:nowrap}
.share-btn:active{opacity:.8}
.share-btn.pdf{background:#230835;color:#fff}
.share-btn.wa{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.share-btn.copy{background:#fff;color:var(--text);border:1.5px solid var(--border)}
@media print{
  .topbar,.grad-line,.share-row,#topbarActions,.btn-accept,.secure-note,.paid-banner .paid-sub{display:none!important}
  body{background:#fff!important;margin:0;padding:0}
  .wrap{padding:0;max-width:100%}
  .card{box-shadow:none!important;border:1px solid #e5e7eb!important;border-radius:0!important;margin-bottom:8px}
  .card-body{padding:14px 18px}
  .pay-section{background:linear-gradient(135deg,#4000f3,#e65afc)!important;border-radius:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pay-total,.pay-amount-lbl{color:#fff!important}
  .btn-pay{background:#ffffff!important;color:#230835!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:block!important}
  .paid-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .footer-grid{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:15mm}
}
@media(max-width:480px){.q-header{flex-direction:column}.footer-grid{grid-template-columns:1fr}.pay-total{font-size:26px}.share-row{grid-template-columns:1fr}}
</style>
</head>

function fmtCAD(n){ return "$"+Math.abs(parseFloat(n||0)).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
// Parse date-only ('YYYY-MM-DD') as LOCAL noon so it never shifts back a day (UTC bug).
function dOnly(str){ return (typeof str==='string' && str.length<=10) ? new Date(str+'T12:00:00') : new Date(str); }
function fmtDate(str){ if(!str)return""; return dOnly(str).toLocaleDateString("en-CA",{day:"2-digit",month:"short",year:"numeric"}); }

// ── Branded file URLs ──

// storage bucket, set BRANDED_FILES_BASE and PDF links show your own domain
// instead of the supabase.co URL. Empty = unchanged (still works as-is).
var BRANDED_FILES_BASE = "https://hub.adviuz.ca/storage"; // same branded style as partner proposals
var SB_STORAGE_PREFIX  = SB_URL + "/storage/v1/object/public/adviuz-files/";
function brandFileUrl(url){
  if(!url || !BRANDED_FILES_BASE) return url || "";
  if(url.indexOf(SB_STORAGE_PREFIX) === 0){
    return BRANDED_FILES_BASE.replace(/\/+$/,'') + "/" + url.slice(SB_STORAGE_PREFIX.length);
  }
  return url;
}

var quoteId  = new URLSearchParams(window.location.search).get("id");
var justPaid = new URLSearchParams(window.location.search).get("paid") === "1";

async function loadQuote(){
  if(!quoteId){ showError("No quote ID","Please use the link from your email."); return; }
  try{
    var res = await fetch(SB_URL+"/rest/v1/rpc/get_quote",{
      method:"POST",
      headers:{"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({p_id:quoteId})
    });
    var data = await res.json();
    if(!data||!data.length){ showError("Quote not found","This link may be expired or invalid."); return; }
    var q = data[0];
    // Optimistic display when returning from Stripe success — the webhook does the real DB update
    if(justPaid && q.status!=="paid"){ q.status = "paid"; }
    renderQuote(q);
  }catch(e){
    console.error("[loadQuote] Error:", e.message, e.stack);
    showError("Failed to load", e.message || "Please try again or contact sales@adviuz.ca");
  }
}

function renderQuote(q){
  try {
  var sMap={draft:"Draft",sent:"Sent",viewed:"Viewed",accepted:"Accepted",paid:"Paid",rejected:"Declined",expired:"Expired"};

  var items=q.items||[];

  var taxRule=PROV_TAX[province]||PROV_TAX["SK"];

  var discount=q.discount_amount||0;
  var subAfter=Math.max(0,sub-discount);
  var taxAmt=q.tax_amount||(subAfter*taxRule.rate);
  var total=q.total||(subAfter+taxAmt);
  var isPaid=q.status==="paid";
  var isExp=q.status==="expired"||(q.valid_until && String(q.valid_until).slice(0,10) < new Date().toLocaleDateString("en-CA"));
  var canPay=!isPaid&&!isExp&&q.status!=="rejected";
  var html="";

      +"<div class='paid-sub'>Thank you. Your payment is confirmed.<br>Invoice emailed to "+q.recipient_email+"</div>"
      +(invoiceUrl ? "<div style='margin-top:16px'><a href='"+invoiceUrl+"' target='_blank' style='display:inline-block;background:#fff;color:#065f46;padding:10px 24px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none'>Download Invoice</a></div>" : "<div style='margin-top:12px;font-size:12px;color:rgba(255,255,255,.7)'>Invoice generating... check your email in a few minutes.</div>")

  html+="<div class='card'><div class='card-body'><div class='q-header'>"

    +"<div class='prepared'>"
      +"<div class='section-title'>Prepared For</div>"
      +"<div class='biz-name'>"+(q.recipient_biz||q.recipient_name)+"</div>"
      +"<div class='biz-addr'>"+(province||"")+"<br>"+q.recipient_email+"</div>"
    +"</div>"
    +"</div></div></div>";

  // Line items
  html+="<div class='card'><div class='card-body'>"
    +"<table class='items-table'><thead><tr><td>Description</td><td>Amount (CAD)</td></tr></thead><tbody>";
  items.forEach(function(item){
    html+="<tr><td>"+(item.qty&&item.qty>1?item.qty+" X ":"")+item.name
      +(item.description?"<div style='font-size:12px;color:var(--sub);margin-top:3px'>"+item.description+"</div>":"")
      +"</td><td>"+fmtCAD(item.total||item.amount||item.unit_price*item.qty)+"</td></tr>";
  });
  html+="</tbody></table><div class='totals'>";
  html+="<div class='total-row'><span style='color:var(--sub)'>Subtotal</span><span style='font-weight:600'>"+fmtCAD(sub)+"</span></div>";
  if(discount>0) html+="<div class='total-row' style='color:var(--red)'><span>Discount</span><span>- "+fmtCAD(discount)+"</span></div>";
  html+="<div class='total-row'><span style='color:var(--sub)'>Taxable Amount</span><span style='font-weight:600'>"+fmtCAD(subAfter)+"</span></div>";
  html+="<div class='total-row'><span style='color:var(--sub)'>Tax ("+taxRule.label+")</span><span style='font-weight:600'>"+fmtCAD(taxAmt)+"</span></div>";
  html+="<div class='total-row'><span style='color:var(--sub)'>Total Contract Value</span><span style='font-weight:600'>"+fmtCAD(total)+"</span></div>";
  html+="<div class='total-row grand'><span>Amount Due Now</span><span>"+fmtCAD(total)+" CAD</span></div>";
  html+="</div></div></div>";

  // Determine amount due now
  var schedule = q.installment_schedule || [];
  var numInstall = q.installments || 1;
  var amountDueNow = total;
  var installLabel = 'Total Amount Due';
  if(numInstall > 1 && schedule.length > 0) {
    // Find first unpaid installment
    var firstUnpaid = schedule.find(function(i){return i.status!=='paid';}) || schedule[0];
    amountDueNow = parseFloat(firstUnpaid.amount);
    installLabel = 'Amount Due Now (Payment '+firstUnpaid.number+' of '+numInstall+')';
  }

  // Direct Stripe checkout URL (GET redirect)
  var CHECKOUT_URL = 'https://crhvvfomwkrgwlnfruad.supabase.co/functions/v1/stripe-checkout';
  var firstUnpaidIdx = schedule.length > 0 ? Math.max(0, schedule.findIndex(function(i){return i.status!=='paid';})) : 0;

  // Pay section
  if(canPay){
    html+="<div class='pay-section'>"
      +"<div class='pay-amount-lbl'>"+installLabel+"</div>"
      +"<div class='pay-total'>"+fmtCAD(amountDueNow)+"</div>"
      +"<button class='btn-pay' id='stripePayBtn' onclick='payWithStripe(\""+q.id+"\","+( firstUnpaidIdx+1)+")'>Pay Now &rarr;&nbsp; Secure online payment</button>"
      +"<a href='#' data-qid='"+q.id+"' onclick='acceptQuote(this.dataset.qid); return false;' class='btn-accept'>Accept &mdash; I will pay via e-transfer or bank transfer</a>"
      +"<div class='secure-note'>Secure payment &bull; CAD only &bull; All major cards accepted</div>"
      +"</div>"
      +"<div class='stripe-note'>Paying online securely saves your card with Stripe for optional auto-refills &mdash; you stay in control and can switch it off or remove the card anytime in your hub under Billing.</div>";
  } else if(isPaid){
    html+="<div style='background:var(--green);border-radius:14px;padding:20px 24px;text-align:center;margin-bottom:14px'>"
      +"<div style='color:#fff;font-weight:600;font-size:16px'>&#x2705; Payment Complete</div>"
      +"<div style='color:rgba(255,255,255,.8);font-size:13px;margin-top:4px'>Invoice emailed to "+q.recipient_email+"</div></div>";
  } else if(isExp){
    html+="<div class='error-card'><div style='font-size:18px;font-weight:600;color:var(--red);margin-bottom:8px'>Quote Expired</div>"
      +"<div style='font-size:13px;color:#92400e'>Contact <a href='mailto:sales@adviuz.com' style='color:var(--red)'>sales@adviuz.com</a> for an updated quote.</div></div>";
  }

  // Share row — PDF uses pdfmonkey URL if available, else print
  var pdfUrl = brandFileUrl(q.pdf_url || '');
  html+="<div class='share-row'>"
    +(pdfUrl
      ? (IN_APP
          ? "<button id='sharePdfBtn' onclick='openPdfInApp(\""+pdfUrl+"\")' class='share-btn pdf'>Download PDF</button>"
          : "<a href='"+pdfUrl+"' target='_blank' id='sharePdfBtn' class='share-btn pdf'>Download PDF</a>")
      : "<button id='sharePdfBtn' onclick='downloadPDF()' class='share-btn pdf'>Download PDF</button>")
    +"<a id='waBtn' href='#' class='share-btn wa' target='_blank'><img src='"+WA_ICON+"' width='15' height='15' style='display:block' alt=''> WhatsApp</a>"
    +"<button class='share-btn copy' onclick='copyQuoteLink()'>Copy Link</button>"
    +"</div>";

  // Notes
  if(q.notes){
    html+="<div class='card'><div class='card-body'>"
      +"<div class='section-title'>Notes</div>"
      +"<div style='font-size:14px;color:var(--sub);line-height:1.8'>"+(q.notes||"").split("\n").join("<br>")+"</div>"
      +"</div></div>";
  }

  // Payment schedule — show installments if multiple
  var schedule = q.installment_schedule || [];
  var numInstall = q.installments || 1;
  html+="<div class='card'><div class='card-body'>"
    +"<div class='section-title'>Payment Schedule</div>";
  if(schedule.length > 1) {
    schedule.forEach(function(inst) {
      var instDue = inst.due_date ? dOnly(inst.due_date).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}) : '';
      var isPaidInst = inst.status === 'paid';
      html+="<div class='sched-row'>"
        +"<div><div style='font-weight:600;font-size:14px;color:var(--text)'>Payment "+inst.number+"</div>"
        +"<div style='font-size:12px;color:var(--sub)'>Due: "+instDue+"</div></div>"
        +"<div style='display:flex;align-items:center;gap:10px'>"
        +"<div style='font-weight:600;font-size:14px;color:var(--text)'>"+fmtCAD(inst.amount)+"</div>"
        +(isPaidInst?"<span style='font-size:11px;font-weight:600;color:var(--green)'>✓ PAID</span>":"")
        +"</div>"
        +"</div>";
    });
    html+="<div style='margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--sub)'>"
      +"<span>"+numInstall+" payments total</span>"
      +"<span>"+fmtCAD(total)+" CAD</span>"
      +"</div>";
  } else {
    html+="<div class='sched-row'>"
      +"<div><div style='font-weight:600;font-size:14px;color:var(--text)'>Payment 1</div>"
      +"<div style='font-size:12px;color:var(--sub)'>Due: "+fmtDate(q.created_at)+"</div></div>"
      +"<div style='font-weight:600;font-size:14px;color:var(--text)'>"+fmtCAD(total)+"</div>"
      +"</div>";
  }
  html+="</div></div>";

  // Bank transfer
  html+="<div class='card'><div class='card-body'>"
    +"<div class='section-title'>Bank Transfer / E-Transfer Details</div>"
    +"<div style='background:#f7f3ff;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#4000f3'>"
    +"<strong>E-Transfer:</strong> Send to <strong>sales@adviuz.ca</strong> &mdash; use Quote # as reference</div>"
    +"<table class='bank-table'>"
    +"<tr><td>Account Name</td><td>Instad Web Services Limited</td></tr>"
    +"<tr><td>Bank Name</td><td>TD Canada Trust</td></tr>"
    +"<tr><td>Account Number</td><td>5016709</td></tr>"
    +"<tr><td>Transit Number</td><td>77348</td></tr>"
    +"<tr><td>Institution Number</td><td>004</td></tr>"
    +"<tr><td>SWIFT Code</td><td>TDOMCATTOR</td></tr>"
    +"<tr><td>Branch Address</td><td>3003 Clarence Ave S, Saskatoon, SK, S7T 0B4</td></tr>"
    +"</table>"
    +"<div class='bank-ref'>Please mention <strong>Quote #"+q.quote_number+"</strong> in the transfer reference.</div>"
    +"</div></div>";

  // Footer
  html+="<div class='card' style='overflow:hidden'>"
    +"<div class='footer-grid'>"
    +"<div><div class='footer-lbl'>Tax Details</div><div class='footer-val'>GST: 746780360RT0001<br>PST: 8234833</div></div>"
    +"<div><div class='footer-lbl'>North America</div><div class='footer-val'>Instad Web Services Limited<br>Unit 400, Scotiabank Building<br>111 2nd Avenue South<br>Saskatoon, SK S7K 1K6<br>Canada</div></div>"
    +"<div><div class='footer-lbl'>Contact</div><div class='footer-val'><a href='https://adviuz.ca' style='color:#4000f3'>adviuz.ca</a><br><a href='mailto:sales@adviuz.ca' style='color:#4000f3'>sales@adviuz.ca</a></div></div>"
    +"</div>"
    +"<div class='footer-bottom'>Generated: "+new Date().toLocaleString("en-CA",{dateStyle:"medium",timeStyle:"short"})+" &bull; This is a system generated quote and does not require a signature. <span style='opacity:.5'>qv2026-06-12b</span></div>"
    +"</div>";

  document.getElementById("main").innerHTML = html;

  // Store pdfmonkey URL globally for download button
  window._currentPdfUrl = brandFileUrl(q.pdf_url || '');

  // PDF button is already an <a href target="_blank"> when pdf_url exists
  // No onclick needed — the href handles the click

  setupWhatsAppShare(q, total);

  } catch(renderErr) {
    console.error("[renderQuote] Error:", renderErr.message, renderErr.stack);
    showError("Render error", renderErr.message);
  }
}

async function payWithStripe(qid, installmentNum){
  var btn=document.getElementById("stripePayBtn");
  if(btn){btn.innerHTML="&#x23F3; Connecting to Stripe...";btn.style.opacity=".7";btn.disabled=true;}
  try{
    var res=await fetch(SB_URL+"/functions/v1/stripe-checkout",{
      method:"POST",
      headers:{"apikey":SB_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({quote_id:qid, installment_num: installmentNum||1})
    });
    if(!res.ok){
      var errText=await res.text();
      throw new Error("Server error ("+res.status+"): "+errText.slice(0,200));
    }
    var data=await res.json();
    if(data.error)throw new Error(data.error);
    if(!data.checkout_url)throw new Error("No checkout URL returned");
    window.location.href=data.checkout_url;
  }catch(e){
    console.error("[payWithStripe]",e);
    if(btn){btn.innerHTML="Pay Now &rarr; Secure online payment";btn.style.opacity="1";btn.disabled=false;}
    alert("Payment setup failed: "+e.message+"\n\nAlternatively, e-transfer to sales@adviuz.ca");
  }
}

// Auto-trigger pay if ?action=pay in URL
window.addEventListener('load',function(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('action')==='pay'){
    setTimeout(function(){
      var btn=document.getElementById('stripePayBtn');
      if(btn&&!btn.disabled) btn.click();
    },800);
  }
});

async function acceptQuote(qid){
  if(!confirm("Accept this quote and pay via e-transfer or bank transfer?\n\nOur team will follow up to confirm your payment."))return;
  await fetch(SB_URL+"/rest/v1/rpc/accept_quote",{
    method:"POST",
    headers:{"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({p_id:qid})
  }).catch(function(){});
  var _sp=document.getElementById("statusPill"); if(_sp){_sp.textContent="Accepted";_sp.className="status-pill s-accepted";}
  alert("Quote accepted!\n\nOur team will be in touch within 24 hours.\n\nE-Transfer to: sales@adviuz.ca\nReference: "+qid.slice(0,8));
}

function showError(title,sub){
  document.getElementById("main").innerHTML="<div class='error-card'><div style='font-size:18px;font-weight:600;color:var(--red);margin-bottom:8px'>"+title+"</div><div style='font-size:13px;color:#92400e'>"+sub+"</div></div>";
  var _spe=document.getElementById("statusPill"); if(_spe) _spe.textContent="Error";
}

// ── PDF DOWNLOAD ──
// When this page runs INSIDE the Adviuz app (an iframe with its own Close
// header), opening the PDF directly would cover the whole app with no way
// back. Instead we hand the URL to the app, which shows it in the same
// overlay viewer with a Close button. In a normal browser, behavior is
// unchanged (new tab).
var IN_APP = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();
function openPdfInApp(u){
  try { parent.postMessage({ type: 'adviuz-open-file', url: u, title: 'Quote PDF' }, window.location.origin); }
  catch(e){ window.location.href = u; }
}
function downloadPDF(){
  // Only called when button has no href (pdf_url not available yet)
  var pdfLink = window._currentPdfUrl;
  if(pdfLink) {
    if(IN_APP) openPdfInApp(pdfLink); else window.open(pdfLink, '_blank');
  } else {
    window.print();
  }
}

// ── WHATSAPP SHARE ──
function setupWhatsAppShare(q, total){
  var qUrl = window.location.origin + "/quote/?id=" + q.id;
  var totalFmt = "$" + parseFloat(total).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}) + " CAD";
  var msg = "Hi! Please find your quote from Adviuz."
    + "\n\n*Quote #" + q.quote_number + "*"
    + "\n*" + (q.recipient_biz||q.recipient_name) + "*"
    + "\n*Amount:* " + totalFmt
    + (q.valid_until ? "\n*Valid Until:* " + dOnly(q.valid_until).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}) : "")
    + "\n\n*View, Pay & Download PDF:*\n" + qUrl
    + "\n\n_Pay securely by card, or e-transfer to sales@adviuz.ca with quote # as reference._";
  var waUrl = "https://wa.me/?text=" + encodeURIComponent(msg);
  // Topbar button
  var waTopBtn = document.getElementById("waShareBtn");
  if(waTopBtn){ waTopBtn.href = waUrl; waTopBtn.target = "_blank"; }
  // Inline button
  var waInlineBtn = document.getElementById("waBtn");
  if(waInlineBtn){ waInlineBtn.href = waUrl; waInlineBtn.target = "_blank"; }
}

// ── COPY LINK ──
function copyQuoteLink(){
  var url = window.location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){
      showCopyToast();
    });
  } else {
    var el = document.createElement("textarea");
    el.value = url; document.body.appendChild(el);
    el.select(); document.execCommand("copy");
    document.body.removeChild(el);
    showCopyToast();
  }
}
function showCopyToast(){
  var t = document.createElement("div");
  t.textContent = "Link copied!";
  t.style.cssText = "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;font-family:var(--f)";
  document.body.appendChild(t);
  setTimeout(function(){ document.body.removeChild(t); }, 2000);
}

loadQuote();
